<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Sueño</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card">
    <h2>Registro de Horas de Sueño</h2>
    
    <label for="dormi">¿A qué hora te dormiste? (HH:MM)</label>
    <input type="text" id="dormi" value="23:00">
    
    <label for="desperte">¿A qué hora te despertaste? (HH:MM)</label>
    <input type="text" id="desperte" value="07:00">
    
    <button id="btn-calcular">Calcular Sueño</button>
    
    <div id="resultado"></div>
</div>

<script src="script.js"></script>
</body>
</html>
